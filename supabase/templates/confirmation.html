<!doctype html>
<html lang="en">
  <body style="font-family:Arial,sans-serif;background:#f5f5f2;color:#111;padding:32px">
    <main style="max-width:520px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:32px">
      <p style="color:#087f5b;font-weight:700;letter-spacing:.08em">COMYVO</p>
      <h1 style="font-size:24px">Your verification code</h1>
      <p>Enter this six-digit code to sign in:</p>
      <p style="font-size:34px;font-weight:800;letter-spacing:.2em">{{ .Token }}</p>
      <p>This code expires in 10 minutes. If you did not request it, you can ignore this email.</p>
    </main>
  </body>
</html>
