name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SITE_URL: https://comyvo.example
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      RATE_LIMIT_SECRET: ci-placeholder-rate-limit-secret-32-characters
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: Comyvo <notifications@comyvo.example>
      TWILIO_ACCOUNT_SID: AC_ci_placeholder
      TWILIO_AUTH_TOKEN: ci_placeholder
      TWILIO_VERIFY_SERVICE_SID: VA_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run audit:prod
      - run: npm run build
